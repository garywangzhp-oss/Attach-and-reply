name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # npm ci is what the add-on reviewer runs too, and it installs nothing:
      # this project has no dependencies.
      - name: Install
        run: npm ci

      - name: Test, check and build
        run: npm run release

      - name: Attach the .xpi to a GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.xpi
            dist/*.sha256
          generate_release_notes: true

      # Signing stays manual - see README.md ("Publishing").
